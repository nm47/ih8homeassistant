[broker]
host = "127.0.0.1"
port = 1883
user = ""
pass = ""
qos  = 0

# MCP tools for Sophie and Claude Code, at http://<host>:<port>/mcp
[mcp]
host  = "0.0.0.0"
port  = 8540
token = ""   # set to require "Authorization: Bearer <token>"

# Every device in the house. Fields beyond type/name/topics/options:
#   id      stable name for the MCP tools
#   room    room-wide commands switch everything in it except printers
#   aliases other names the MCP tools accept
#   printer on-only in Matter; switching off needs a person's confirmation
#   matter  whether Matter controllers see it. The Matter endpoint ID comes from the name,
#           so renaming a Matter device makes phones and hubs see a new device.
#   kind    free-text description

[[devices]]
type    = "OnOffPlugInUnitDevice"
name    = "Den Light"
id      = "den_light"
room    = "den"
kind    = "light switch"
matter  = true

[devices.topics]
getOnline = "tele/den_light/LWT"
getOn     = "stat/den_light/POWER"
setOn     = "cmnd/den_light/POWER"
getState  = "tele/den_light/STATE"

[[devices]]
type    = "OnOffPlugInUnitDevice"
name    = "Dining Room Light"
id      = "dining_room_light"
room    = "dining room"
kind    = "light switch"
matter  = true

[devices.topics]
getOnline = "tele/dining_room_light/LWT"
getOn     = "stat/dining_room_light/POWER"
setOn     = "cmnd/dining_room_light/POWER"
getState  = "tele/dining_room_light/STATE"

[[devices]]
type    = "OnOffLightDevice"
name    = "Closet Light"
id      = "closet_light"
room    = "bedroom"
aliases = ["closet"]
kind    = "light switch"
matter  = true

[devices.topics]
getOnline = "tele/closet_light/LWT"
getOn     = "stat/closet_light/POWER"
setOn     = "cmnd/closet_light/POWER"
getState  = "tele/closet_light/STATE"

[[devices]]
type    = "ExtendedColorLightDevice"
name    = "Nudge"
id      = "nudge"
room    = "living room"
aliases = ["nudge lamp"]
kind    = "lamp with color and brightness"
matter  = true

[devices.topics]
getOnline = "nudge/status/online"
getRGB    = "nudge/status/color"
getBrightness = "nudge/status/brightness"
getOn     = "nudge/status/power"
setRGB    = "nudge/command/color"
setBrightness = "nudge/command/brightness"
setOn     = "nudge/command/power"

[devices.options]
onValue   = "ON"
offValue  = "OFF"
onlineValue = "online"
hex       = true
hexPrefix = "#"

[[devices]]
type    = "OnOffLightDevice"
name    = "Living Room Light"
id      = "living_room_light"
room    = "living room"
kind    = "light switch"
matter  = true

[devices.topics]
getOnline = "tele/living_room_light/LWT"
getOn     = "stat/living_room_light/POWER"
setOn     = "cmnd/living_room_light/POWER"
getState  = "tele/living_room_light/STATE"

[[devices]]
type    = "OnOffLightDevice"
name    = "Lanterns"
id      = "lanterns"
room    = "living room"
aliases = ["lantern"]
kind    = "plug"
matter  = true

[devices.topics]
getOnline = "tele/lanterns/LWT"
getOn     = "stat/lanterns/POWER"
setOn     = "cmnd/lanterns/POWER"
getState  = "tele/lanterns/STATE"

[[devices]]
type    = "OnOffLightDevice"
name    = "Reading Lamp"
id      = "reading_lamp"
room    = "den"
aliases = ["reading light"]
kind    = "plug, a lamp"
matter  = true

[devices.topics]
getOnline = "tele/reading_lamp/LWT"
getOn     = "stat/reading_lamp/POWER"
setOn     = "cmnd/reading_lamp/POWER"
getState  = "tele/reading_lamp/STATE"

[[devices]]
type    = "GenericSwitchDevice"
name    = "blup"
id      = "blup"
room    = "den"
aliases = ["bubbles", "bubble machine"]
kind    = "notifier that blows bubbles"
matter  = true

[devices.topics]
getOnline  = "blup/status/online"
setCommand = "blup/command/bubble"

[devices.options]
onlineValue  = "online"
offlineValue = "offline"
commandValue = ""

# Matter knew this as "Living Room TV"; renamed on 2026-10-28, so controllers see it as new
[[devices]]
type    = "TVDevice"
name    = "TV"
id      = "tv"
room    = "den"
aliases = ["television", "den tv"]
kind    = "TV over HDMI-CEC"
matter  = true

[devices.topics]
getOnline = "tele/tv/LWT"
getState  = "tele/tv/STATE"
setPower  = "cmnd/tv/POWER"
setInput  = "cmnd/tv/INPUT"

[devices.options]
onValue      = "ON"
offValue     = "OFF"
onlineValue  = "Online"
offlineValue = "Offline"
inputs       = ["HDMI1", "HDMI2", "HDMI3", "HDMI4"]

[[devices]]
type    = "OnOffPlugInUnitDevice"
