services:
  ih8homeassistant:
    build:
      context: ./ih8homeassistant
      dockerfile: Dockerfile
    container_name: ih8homeassistant-bridge
    restart: unless-stopped

    # tini as PID 1, so signals are forwarded and children are reaped
    init: true

    # Use host network for Matter mDNS discovery
    # Required for Matter device discovery to work properly
    network_mode: host

    volumes:
      # Fallback config for standalone runs. In this deployment the parent compose file
      # mounts config/ih8homeassistant to /app/config, which the bridge prefers.
      - ./ih8homeassistant/config.toml:/app/config.toml:ro

      # Persistent storage for Matter device state (fabrics, node identity)
      - ih8homeassistant-storage:/app/.matter

    environment:
      # Storage location for Matter.js persistence.
      # Matter.js only reads MATTER_-prefixed vars; MATTER_STORAGE_PATH -> storage.path.
      # Without the prefix this is ignored and state lands in $HOME/.matter instead,
      # outside the volume above.
      MATTER_STORAGE_PATH: /app/.matter

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Persistent volume for Matter device state
  ih8homeassistant-storage:
    driver: local
